<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E3B4D">
<title>Log in — Flood Monitoring System</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="auth" id="main">

    <a class="auth-brand" href="index.html"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c4.6 5.7 8.5 10 8.5 14.6a8.5 8.5 0 0 1-17 0C7.5 13 11.4 8.7 16 3z" fill="#E6B25E"/><path d="M9.6 18.4c1.6-1.4 3.2-1.4 4.8 0s3.2 1.4 4.8 0 2.2-.9 3-.4" fill="none" stroke="#0E3B4D" stroke-width="1.8" stroke-linecap="round"/></svg><span>Flood Monitoring System</span></a>

    <form class="login-box" onsubmit="login(event)" novalidate>

        <h1>Log in</h1>
        <p class="auth-sub">Open the dashboard to see current water levels.</p>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" inputmode="email" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required>
        </div>


        <button class="btn" id="loginButton" type="submit">Log in</button>

        <p class="form-status" id="message" role="status" aria-live="polite"></p>

        <p class="auth-alt">No account yet? <a href="register.html">Sign up</a></p>

    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>

</body>
</html>
