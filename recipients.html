<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipient Management</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="recipients.css">
</head>

<body class="recipient-page">

<nav>

    <div class="brand">
        <h2>💧 Flood Monitoring System</h2>
    </div>

    <div class="user-account">
        <span id="userName">Loading user...</span>
        <small id="userRole"></small>
    </div>

    <div class="nav-actions">

        <a href="index.html#dashboard" class="nav-icon-link" title="Dashboard">
            <span class="icon-chip icon-chip--menu" aria-hidden="true">🏠</span>
            <span class="nav-icon-label">Dashboard</span>
        </a>

        <div class="nav-menu">

            <button
                type="button"
                class="menu-button"
                id="menuButton"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="navDropdown"
                onclick="toggleMenu()"
            >
                <svg viewBox="0 0 20 16" width="20" height="16" aria-hidden="true">
                    <rect y="0" width="20" height="2.4" rx="1.2" fill="currentColor"/>
                    <rect y="6.8" width="20" height="2.4" rx="1.2" fill="currentColor"/>
                    <rect y="13.6" width="20" height="2.4" rx="1.2" fill="currentColor"/>
                </svg>
                <span class="sr-only">Menu</span>
            </button>

            <div class="nav-dropdown" id="navDropdown" role="menu">

                <a href="telemetry.html" id="telemetryMenu" class="nav-dropdown-item" role="menuitem">
                    <span class="icon-chip icon-chip--menu" aria-hidden="true">📶</span>
                    Telemetry
                </a>

                <a href="history.html" id="historyMenu" class="nav-dropdown-item" role="menuitem">
                    <span class="icon-chip icon-chip--menu" aria-hidden="true">📊</span>
                    History Logs
                </a>

                <a href="recipients.html" id="recipientMenu" class="nav-dropdown-item" role="menuitem">
                    <span class="icon-chip icon-chip--menu" aria-hidden="true">📱</span>
                    Recipients
                </a>

                <a href="index.html#settings" id="settingsMenu" class="nav-dropdown-item" role="menuitem">
                    <span class="icon-chip icon-chip--menu" aria-hidden="true">⚙️</span>
                    Settings
                </a>

                <div class="nav-dropdown-divider"></div>

                <button
                    type="button"
                    class="nav-dropdown-item nav-dropdown-item--logout"
                    role="menuitem"
                    onclick="logout()"
                >
                    <span class="icon-chip icon-chip--menu" aria-hidden="true">🚪</span>
                    Logout
                </button>

            </div>

        </div>

    </div>

</nav>

<main class="container">

    <a href="index.html#dashboard" class="back-link">
        <span class="back-link-arrow" aria-hidden="true">←</span> Dashboard
    </a>

    <h1>📱 Recipient Management</h1>

    <form id="recipientForm" class="card form-card recipient-form-card">
        <h2 class="card-title">Add SMS Recipient</h2>

        <div class="field">
            <label for="recipientName">Full Name</label>
            <input
                id="recipientName"
                name="name"
                type="text"
                placeholder="Enter full name"
                autocomplete="name"
                maxlength="120"
                required
            >
        </div>

        <div class="field">
            <label for="mobileNumber">Mobile Number</label>
            <input
                id="mobileNumber"
                name="mobile_number"
                type="tel"
                placeholder="Enter mobile number"
                autocomplete="tel"
                maxlength="30"
                required
            >
        </div>

        <div class="form-actions">
            <button id="submitButton" class="btn" type="submit">
                Add Recipient
            </button>
        </div>

        <p id="recipientFormMessage" class="form-status" role="status" aria-live="polite"></p>
    </form>

    <section class="recipient-list-section" aria-labelledby="recipientListTitle">
        <div class="recipient-list-heading">
            <h2 id="recipientListTitle" class="card-title">Registered Recipients</h2>
            <span id="recipientCount" class="table-meta">Loading recipients...</span>
        </div>

        <div class="table-card recipient-table-card">
            <table aria-label="Registered SMS recipients">
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Mobile</th>
                        <th scope="col">Status</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>

                <tbody id="recipientBody">
                    <tr class="table-empty">
                        <td colspan="4">Loading registered recipients...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p id="recipientPageMessage" class="form-status recipient-page-message" role="status" aria-live="polite"></p>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="nav.js"></script>
<script src="recipients.js"></script>

</body>
</html>
